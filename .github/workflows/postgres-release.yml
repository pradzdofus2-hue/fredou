name: FREDOU PostgreSQL Release Validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fredou-postgres-release-validation
  cancel-in-progress: false
jobs:
  database:
    name: Read-only catalogue and rollback-only game writes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.FREDOU_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Ensure protected database secret exists
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure the repository secret FREDOU_TEST_DATABASE_URL before manually triggering this workflow."
            exit 1
          fi
      - name: Install pinned dependencies
        run: npm ci
      - name: Check live database schema and guest state (read-only)
        run: npm run db:check:runtime
      - name: Check all live catalogue assets against this checkout (read-only)
        run: npm run db:check:artwork
      - name: Validate complete economy and auth inside rollback transaction
        run: npm run db:test:writes
